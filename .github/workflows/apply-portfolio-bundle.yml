name: Apply portfolio source bundle
on:
  push:
    branches:
      - main
    paths:
      - .portfolio-source.b64
permissions:
  contents: write
jobs:
  apply-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply website files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .portfolio-source.b64 | tar -xz --no-same-owner -C .
          rm -f .portfolio-source.b64
          rm -f .github/workflows/apply-portfolio-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No website changes to apply."
            exit 0
          fi
          git commit -m "Build premium freelance developer portfolio"
          git push origin HEAD:main
